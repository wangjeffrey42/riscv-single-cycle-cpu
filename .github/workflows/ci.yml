# Runs lint and every testbench on each push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
          verilator --version

      - name: Lint
        run: make lint

      # shell: bash turns on pipefail, so the step still fails if make fails.
      - name: Test
        shell: bash
        run: make test 2>&1 | tee test.log

      # On failure, show the end of the output on the run's summary page.
      - name: Show test failure
        if: failure()
        run: echo "::error title=make test failed::$(tail -40 test.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
